<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Example</title>
    <style>
        .Flexbox-container {
            display: flex;
            flex-direction: column;
        }

        #box1 {
            flex: 50;
            background-color: red;
        }

        #box2 {
            flex: 25;
            background-color: green;
        }

        #box3 {
            flex: 25;
            background-color: blue;
        }

        .box-common {
            text-align: center;
            border: 5px solid whitesmoke;
        }

        /*example media query*/
        @media (max-width:500px) {
            .Flexbox-container {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div class="Flexbox-container">
        <div id="box1" class="box-common">
            <p>Box 1</p>
        </div>
        <div id="box2" class="box-common">
            <p>Box 2</p>
        </div>
        <div id="box3" class="box-common">
            <p>Box 3</p>
        </div>
    </div>
</body>

</html>
