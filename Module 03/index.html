<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artshow_example</title>
</head>

<body style="text-align: center;">
    <h1 style="color:rgb(150, 150, 150);">Fall is here wow</h1>

    <h1> Visit Vermont</h1>
    <p style="font-family: sans-serif;font-size:69px;align-items:center">Vermont's foliage is cool I guess?</p>
    <p>my car's color is <span style="color:red">red</span></p>


    <!--Tables
    Includes <table>, <tr> (table row), <td> (table data), <th> (table head), <thead>, and <tfoot>-->
    <div style="background-color: gold;">
        <table style="border: 2px dotted black; border-collapse: collapse;">
            <thead>
                <tr style="background-color:blanchedalmond">
                    <th style="border: 2px dotted black;">Product</th>
                    <th style="border: 2px dotted black;">Cost</th>
                </tr>
            </thead>
            <tr>
                <td style="border-right: 2px dotted black;">Bagel</td>
                <td>$2.50</td>
            </tr>
            <tr>
                <td style="border-right: 2px dotted black;">Cheese</td>
                <td>$3.22</td>
            </tr>
            <tfoot>
                <td style="border-right: 2px dotted black;">footerasdasd</td>
            </tfoot>
        </table>
    </div>
    <audio controls autoplay>
        <source src="stinky.mp3" type="audio/mp3">
    </audio>
    <audio controls>
        <source src="vine-boom.mp3" type="audio/mp3">"
    </audio>
    <footer>auhgushuhdfs quvm</footer>
</body>

</html>
