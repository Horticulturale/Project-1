<!--CSS is the skin of the body, which is HTML-->
<!--Means "Cascading Style Sheet"-->
<!--block and inline:
two common block elements are <p> and <div>, which make paragraphs and dividers.-->
<!--Span is an inline one-->

<!--semantic HTML like <header> <footer> <article> and section add meaning to website structure and improve accessibility.-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body style="background-color:lightsalmon;">
    <h1 style="color:rebeccapurple; text-align:right;">Colored heading</h1>
    <p style="font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif">asgsfgdfg</p>
    <p>my car's color is <span style="color:red">red</span></p>
</body>

</html>
